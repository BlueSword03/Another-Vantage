[package]
name = "another-vantage"
version = "0.1.0"
edition = "2021"
description = "Lenovo Vantage features for Linux (read-only CLI first)"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
strip = true
lto = true
